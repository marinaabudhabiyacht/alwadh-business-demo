<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALWADH BUSINESS | Demo</title><style>body{margin:0;background:#edf3f8;color:#17364d;font:15px Tahoma,Arial}.shell{max-width:1150px;margin:auto;padding:24px}.top{background:#0d618a;color:white;padding:20px;border-radius:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#fff2bf;color:#6c4e00;padding:8px 12px;border-radius:20px;font-weight:bold}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#0d7198;color:white;font-weight:bold}button.alt{background:white;color:#165573;border:1px solid #bed2dd}button.active{background:#123b5b}.panel{background:white;padding:22px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #d9e5ee}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#e9f4fa;border-radius:12px;padding:18px}.metric strong{display:block;font-size:24px;margin-top:10px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-weight:bold}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #c6d7e0;border-radius:8px;margin-top:6px;font:inherit}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:right;border-bottom:1px solid #e3ebf1}.muted{color:#688195}.notice{background:#fff7d7;padding:14px;border-radius:10px;margin-top:16px}@media(max-width:600px){.shell{padding:12px}.top{flex-direction:column;align-items:flex-start}.panel{padding:14px}table{font-size:12px}}</style></head><body><div id="app"></div><script type="module" src="./demo.js"></script></body></html>
