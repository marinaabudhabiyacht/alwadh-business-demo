:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.metric{background:#fff;border:1px solid #e1eaf2;border-top:3px solid #6596ff;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;color:#62788c;font-size:13px}.metric:nth-child(2){border-top-color:#16ca98}.metric:nth-child(3){border-top-color:#ff9e42}.metric:nth-child(4){border-top-color:#ff5f94}.metric:nth-child(5){border-top-color:#16a7a0}.metric strong{font-size:22px;color:#1a3850;direction:ltr;text-align:right}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}label{display:block;font-weight:600;color:#62788c}input,select{width:100%;padding:11px;border:1px solid #d1dfeb;background:#fff;color:#1a3850;border-radius:9px;margin-top:7px}table{width:100%;border-collapse:collapse}td,th{padding:14px 12px;text-align:right;border-bottom:1px solid #e8eff5;font-size:13px}th{color:#62788c}td{color:#1a3850}.muted{color:#62788c}.welcome{background:linear-gradient(115deg,#1265ae,#16a7a0);color:white;padding:28px;border-radius:18px;margin:0 32px 20px}.welcome h2{font-size:24px;margin:0}.welcome p{margin:0;color:#dbe6ff}.dashgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:0 32px}.dashgrid .panel{margin:0}.status{background:#dff8eb;color:#116947;padding:4px 10px;border-radius:20px;font-size:11px}.dashchart{display:flex;align-items:end;justify-content:space-around;height:180px;gap:14px;border-bottom:1px solid #e8eff5}.dashchart span{width:10%;background:linear-gradient(#16a7a0,#1265ae);border-radius:6px 6px 0 0}.quickactions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quickactions button{padding:18px;background:#e8f2fa;color:#17588c}.dashboardcards{margin:0 32px 20px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.dashgrid{grid-template-columns:1fr}}@media(max-width:700px){.shell{padding-right:0;padding-bottom:75px}.nav{top:auto;bottom:0;left:0;width:100%;height:75px;flex-direction:row;overflow:auto;padding:8px}.nav
