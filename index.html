<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALWADH BUSINESS | Demo</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#152d4a;background:#f4f7fc}*{box-sizing:border-box}body{margin:0;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#2455c7;color:#fff;font-weight:700;transition:.2s}button:hover{filter:brightness(.95)}button.alt{background:#fff;color:#38516c;border:1px solid #dbe4f1}button.active{background:#2455c7;color:#fff;box-shadow:0 5px 16px #2455c73b}.shell{max-width:none;min-height:100vh;padding:0 254px 0 0}.top{height:84px;background:#fff;border-bottom:1px solid #e7edf6;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;gap:20px}.top h1{font:800 23px Arial;margin:0;color:#14346e;letter-spacing:.5px}.top small{color:#8593a7;font-size:12px}.tag{display:inline-flex;align-items:center;gap:7px;background:#fff6db;color:#a26b09;border:1px solid #f7e8ad;border-radius:30px;padding:9px 14px;font-size:12px;font-weight:700}.notice{margin:24px 32px 0;background:#eff5ff;border:1px solid #dce9ff;color:#41618c;padding:14px 18px;border-radius:12px;font-size:12px}.nav{position:fixed;right:0;top:0;bottom:0;width:254px;background:#102c5a;padding:30px 14px;display:flex;flex-direction:column;gap:7px;z-index:5;box-shadow:-3px 0 18px #102c5a18}.nav:before{content:'ALWADH';display:block;color:#fff;font:bold 27px Arial;letter-spacing:1px;text-align:center;padding:12px 4px 5px}.nav:after{content:'BUSINESS MANAGER  ·  DEMO';display:block;color:#92b2e0;font:10px Arial;letter-spacing:1px;text-align:center;position:absolute;top:80px;left:0;right:0}.nav button,.nav button.alt{background:transparent;color:#b8c9e3;border:0;text-align:right;padding:14px 18px;font-size:14px;border-radius:10px}.nav button:first-child{margin-top:67px}.nav button.active{background:#2b5bc7;color:#fff;box-shadow:none}.nav button:hover{background:#254878;color:#fff}.nav #reset{margin-top:auto!important;border:1px solid #45618d}.panel{background:#fff;margin:24px 32px;border:1px solid #e8edf6;border-radius:18px;padding:25px;box-shadow:0 7px 24px #142e5810}.panel h2{font-size:21px;color:#18345e;margin:0 0 23px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.metric{border:1px solid #e7ecf5;background:#fff;border-radius:15px;padding:23px 19px;color:#708198;font-size:13px;position:relative;box-shadow:0 5px 16px #152c4d08}.metric:before{content:'';display:block;width:35px;height:4px;border-radius:8px;background:#2d5fd0;margin-bottom:19px}.metric:nth-child(2):before{background:#29a0b9}.metric:nth-child(3):before{background:#1c9c76}.metric:nth-child(4):before{background:#e4a33b}.metric:nth-child(5):before{background:#7b59d2}.metric strong{display:block;font:800 23px Arial;color:#19375b;margin-top:11px;direction:ltr;text-align:right;white-space:nowrap}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}label{display:block;font-weight:700;color:#334d6e}input,select,textarea{width:100%;padding:13px;border:1px solid #dbe4f0;border-radius:10px;margin-top:9px;background:#fbfdff;color:#233c60}input:focus,select:focus{outline:2px solid #b9cdfa}table{width:100%;border-collapse:collapse}th{background:#f6f9fe;color:#70839d;font-size:12px;font-weight:700}td,th{padding:17px 14px;text-align:right;border-bottom:1px solid #edf1f8}td{color:#2e4664}.muted{color:#8090a5}.dash-title{margin:28px 32px 4px}.dash-title h2{margin:0;font-size:25px;color:#1a345b}.dash-title p{margin:9px 0;color:#8997a9}.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin:0 32px 28px}.dash-grid .panel{margin:0}.chart{display:flex;align-items:end;justify-content:space-around;gap:13px;height:200px;border-bottom:1px solid #e5ecf6;padding:15px 8px 0}.bar{flex:1;max-width:48px;background:linear-gradient(#4b7be4,#b8cdf9);border-radius:8px 8px
